---
# Main quality gate. Runs the full lint set, the module-structure
# contracts, the Cargo.lock drift check, the dependency policy audit,
# the test suite and the coverage measurement (both matrixed across
# linux/macOS/windows native runners), the interleaving models, and a
# build under the oldest compiler the manifests name, on every pull
# request and every push to `main`.
# Each gate runs as its own job so a flake in one block does not
# require rerunning the others and the PR status surfaces which gate
# fired.
# The text-quality lint set (vale, cspell, rumdl, biome, yamllint,
# tombi) rides in one job off the Brewfile toolchain.
#
# Every job installs `just` from a SHA-pinned casey/just release
# tarball, verifies the bundled SHA256SUMS, and then invokes the
# matching `just <recipe>` so the recipe is the single source of
# truth for what the gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Invokes only the `lint` aggregator recipe, so the job stays
  # unchanged as new gates land — each gate appends itself to the
  # aggregator in the Justfile instead. Those gates used to run only
  # through the local pre-commit hooks, which `git commit --no-verify`
  # walks straight past, so nothing on the merge path read them. The
  # set spans two toolchains now: the prose, spelling, Markdown, JSON,
  # YAML, and TOML checkers come out of the Brewfile, while the Rust
  # gates want a compiler, so the pinned toolchain gets installed here
  # too.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml, same as the other jobs. Its own
      # caching stays off so the step below can own that policy.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Restores on every run, writes back only from `main`, matching
      # the test job. rustfmt reads no build artifacts, but the gates
      # that arrive later compile the crate.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The ubuntu-24.04 image ships Homebrew but leaves its prefix off
      # the PATH, so expose the bin and sbin directories before any brew
      # invocation.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      # Brings in vale, cspell, rumdl, biome, yamllint, and tombi,
      # alongside the rustup and cargo helpers later recipes reach for.
      # The Brewfile also names just, which the setup step above already
      # installed; letting brew reinstall it costs less than keeping a
      # second, partial dependency list in step with the first. Its
      # rustup formula puts a second cargo under the Homebrew prefix,
      # and guarding against exactly that is why the Justfile exports a
      # PATH with the shim directory in front: the toolchain the step
      # above pinned wins no matter which of the two ran last.
      - name: Install Homebrew dependencies
        run: brew bundle install

      # No Homebrew formula packages cargo-machete, so this step fetches
      # a prebuilt binary rather than spending a compile on it. The
      # action checks the download against the publisher's checksum and
      # build attestation on its own. The version sits beside a marker
      # comment Renovate reads, since nothing in its stock managers knows
      # how to find a crate name inside a workflow input.
      - name: Install cargo tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # renovate: datasource=crate depName=cargo-machete
          tool: cargo-machete@0.9.2

      # Vale's style packages are downloaded, not vendored, so
      # `lint-prose` fails on a bare checkout without this. The narrower
      # recipe rather than `install-tools`, whose other half installs a
      # floating cargo build of the tool the step above just pinned.
      - name: Sync Vale styles
        run: just vale-sync

      - name: Run lint gates
        run: just lint

  # The two module-structure checkers block a merge from here rather
  # than from the `lint` aggregator, which every other gate shares.
  # Neither one is cheap to have around: cargo-modules is published as
  # source only and pulls rust-analyzer's crate stack in behind it,
  # while cargo-pup reads the compiler's own data structures and so
  # loads only under the dated nightly it was compiled against.
  # Answering to a second toolchain and a source build of that size is
  # not something to ask of the job the ordinary checkers run in, so
  # these two take a job of their own and stay just as blocking.
  arch:
    name: arch
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action reads rust-toolchain.toml whatever else it is told,
      # so naming the nightly here adds it beside the pinned stable
      # instead of replacing it: cargo-modules builds and runs on the
      # pin, cargo-pup on the nightly. The three components are what a
      # compiler plugin links against. Caching belongs to the step
      # below, as in the other jobs.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-01-22
          components: rust-src,rustc-dev,llvm-tools-preview
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # Both binaries are compiled here because neither has a prebuilt
      # channel to fetch from. The cache above holds ~/.cargo/bin, so a
      # run that restores it finds both already there and cargo says as
      # much and stops; the compile is what a cache miss costs. Each
      # version is written out, and each moves the way the nightly date
      # above does: by hand, since no dependency manager reads a
      # `cargo install` line.
      - name: Install the module checkers
        run: |
          cargo install --locked cargo-modules --version 0.26.0
          cargo +nightly-2026-01-22 install cargo_pup --version 0.1.8 --locked

      - name: Check for unreached modules
        run: just lint-arch

      - name: Check the layer contract
        run: just lint-pup

  # Fails the merge when Cargo.lock no longer matches the manifests, so
  # every change to the dependency closure arrives as a reviewable lock
  # diff rather than resolving differently on each machine.
  lock-check:
    name: lock-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No toolchain input: the action reads rust-toolchain.toml and
      # installs the version pinned there, which is the same resolution
      # a contributor's rustup performs inside the repo.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Check lock drift
        run: just lock-check

  # The blocking half of the dependency security story: an advisory
  # against a resolved version, a license off the allow-list, a
  # duplicate crate version deny.toml does not name, or a source
  # outside crates.io stops the merge here. The reporting half sits in
  # a workflow of its own, where a scanner writes what it finds to code
  # scanning rather than holding a pull request.
  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned toolchain from rust-toolchain.toml. Nothing
      # here is compiled — the checker resolves the graph through cargo
      # metadata — but the resolution answers on the same compiler the
      # rest of the gates use. Caching is off so the step below owns
      # that policy, as in every other job.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Restores everywhere and writes back from `main` alone, matching
      # the jobs above.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A development machine takes this one from the Brewfile; a
      # runner takes the release archive, which the action checks
      # against the SHA256 the release carries before unpacking it. The
      # version is written down rather than floating, and the marker
      # comment naming the crate has to sit on the line above the input
      # it describes for Renovate to read it.
      - name: Install cargo tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # renovate: datasource=crate depName=cargo-deny
          tool: cargo-deny@0.20.2

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Check the dependency policy
        run: just audit

  test:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure should not hide the others: a bug that
      # only shows up on Windows is worth seeing next to a green macOS
      # slot, not instead of it.
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    # Draws this many inputs per property, four times what a property
    # takes when nothing sets the variable. Widening the search costs
    # seconds on a suite this small, and the run someone sits and waits
    # for locally is not the one worth widening. The coverage matrix
    # leaves the count alone: a branch turns up in the first handful of
    # draws or never, so raising it there buys wall-clock rather than
    # coverage.
    env:
      PROPTEST_CASES: "1024"
    steps:
      # harden-runner's egress monitoring is built on Linux kernel
      # facilities, so the macOS and Windows slots skip it.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Caching is turned off here and handed to the explicit step
      # below, because the action's built-in wiring saves a fresh cache
      # from every branch and this repo wants writes from `main` only.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Every slot restores the registry and target directories; only
      # pushes to `main` write a new entry back. Pull request runs would
      # otherwise each save a near-identical cache and evict the warm
      # one their own next run wants to read.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The test runner ships a build for each platform in the matrix,
      # and the action reads the SHA256 the release carries before it
      # unpacks a download. Renovate owns the version through the marker
      # comment on the line above it.
      - name: Install cargo tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # renovate: datasource=crate depName=cargo-nextest
          tool: cargo-nextest@0.9.140

      # The ci profile in .config/nextest.toml keeps the run going past
      # the first failure and writes a JUnit report. Naming it here
      # rather than through an environment variable leaves the choice
      # visible in the step's own log.
      - name: Run tests
        run: just test --profile ci

      # Doctests need their own invocation: the recipe pair exists
      # because the runner above reaches no example inside a doc
      # comment.
      - name: Run doctests
        run: just test-doc

  # Replays the concurrency layer under every thread interleaving loom
  # can reach, which is a different detector from the matrix above
  # rather than more of it: the suite reports what one ordering does
  # and this reports what the worst ordering does. A publication read
  # too weakly, or two threads computing one entry, shows up here and
  # nowhere else. One Linux slot on the pinned toolchain is enough,
  # since the search reads the memory model and not the platform, and
  # the models are small enough for the whole replay to take seconds.
  loom:
    name: loom
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml like every other job here: the models
      # are ordinary safe code and run on the shipping compiler.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Restores on every run and writes back from `main` alone, as
      # the jobs above do. The cache key carries the job name, and the
      # cfg the recipe sets changes every compilation fingerprint, so
      # what lands here is a build of its own rather than a second copy
      # of the matrix job's.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The recipe below drives the models through the same runner the
      # matrix job uses, so this slot needs the binary too. Version and
      # marker match what that job pins.
      - name: Install cargo tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # renovate: datasource=crate depName=cargo-nextest
          tool: cargo-nextest@0.9.140

      - name: Run the interleaving models
        run: just test-loom

  # Coverage takes a matrix of its own rather than riding the test job
  # above. The suite has to run on the toolchain the project ships,
  # while branch instrumentation answers only on a nightly compiler, and
  # no single job can be on both. The slots match the test matrix
  # because a branch only one platform takes still has to be reached by
  # something, and the fan-in below is what says whether it was.
  cover:
    name: "cover (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    steps:
      # As in the test matrix: the egress monitoring rests on Linux
      # kernel facilities the other two platforms do not offer.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dated nightly channel the `coverage_toolchain` variable in
      # the Justfile names, repeated here because the action reads a
      # channel rather than a recipe. Nothing tracks the date, so the two
      # move by hand together. llvm-tools-preview supplies the profile
      # reader the coverage tool shells out to. Its own caching is off so
      # the rust-cache step below is the only thing writing the cache.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # Two installs rather than one step naming both tools: the marker
      # comment Renovate reads has to sit on the line above the `tool:`
      # input, and a list holding two entries leaves nowhere to put the
      # second one.
      - name: Install the test runner
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # renovate: datasource=crate depName=cargo-nextest
          tool: cargo-nextest@0.9.140

      - name: Install the coverage tool
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # renovate: datasource=crate depName=cargo-llvm-cov
          tool: cargo-llvm-cov@0.8.7

      # The runner label names the tracefile, which is how four slots
      # land four artifacts the fan-in can tell apart.
      - name: Measure coverage
        run: just cover "${{ matrix.os }}"

      # Retained for a day: the only consumer is the job below, and it
      # runs minutes after the upload.
      - name: Upload the tracefile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: lcov-${{ matrix.os }}.info
          if-no-files-found: error
          retention-days: 1

  # The authoritative reading. Each slot above already holds itself to
  # every region, and this job answers the question none of them can:
  # what the four runs reached between them, over one merged report.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    needs: cover
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The diff check compares against the base branch, so the full
      # history has to come along rather than the default shallow clone.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Reads the pinned toolchain from rust-toolchain.toml. The nightly
      # compiler belongs to the measurement; reading the tracefile is
      # ordinary work for the shipping one.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The diff check comes from PyPI, where no manager here reads a
      # version out of a workflow file. Bump this pin by hand when the
      # release notes give a reason to, the way the nightly channel above
      # is bumped.
      - name: Install the diff coverage check
        run: uv tool install diff-cover==10.4.1

      # lcov merges the per-slot reports. The runner image ships no copy
      # of it, and neither the coverage tool nor the task runner unions
      # two reports over the same source file.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install --yes lcov

      # merge-multiple drops every slot's tracefile back into the working
      # directory under the name it was written with, which is the glob
      # the combine recipe walks.
      - name: Download the tracefiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Merge the tracefiles and check the total
        run: just cover-combine

      # The merged total already holds the whole tree, so this fires only
      # where a change drops coverage on a line it touched — and then it
      # names that line instead of moving a total by a fraction.
      # github.base_ref exists on pull requests alone, which is what
      # scopes the step.
      - name: Check coverage on the changed lines
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          just cover-diff "origin/${{ github.base_ref }}"

  # Every job above builds on the pinned compiler, which sits a minor
  # release ahead of the one the manifests declare to whoever depends on
  # this library. A dependency raising its own floor, or a language
  # feature younger than the declared release, passes all of them and
  # then meets the caller who took the declaration at face value. One
  # Linux slot settles it: the same sources compile on all four, so a
  # floor holding here holds everywhere.
  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml as the jobs above do. That compiler
      # only reads the manifests and drives cargo hack; the check itself
      # lands on the floor release the step further down installs.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Restores everywhere and writes back from `main` alone. The floor
      # compiler fingerprints its own artifacts, so this slot fills a
      # cache entry separate from the ones the jobs above keep.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A published build arrives ready to run, where the verifier a
      # contributor uses locally would compile itself here first.
      # Renovate owns the version through the marker above the input,
      # and the action checks the download against the SHA256 the
      # release carries.
      - name: Install cargo tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # renovate: datasource=crate depName=cargo-hack
          tool: cargo-hack@0.6.45

      # Which release to fetch comes out of the manifests rather than
      # out of this file. A number written here would part ways with
      # Cargo.toml the first time someone moved the floor, and the gate
      # would go on passing under a compiler nothing declares. Both
      # members inherit the field from the workspace table, so a second
      # answer means the manifests changed shape and the step stops
      # instead of choosing between them.
      - name: Install the floor toolchain
        run: |
          floor=$(cargo metadata --format-version 1 --no-deps | jq -er '
            [.packages[].rust_version]
            | unique
            | if length == 1 then .[0]
              else error("members declare more than one floor") end')
          echo "Declared floor: $floor"
          rustup toolchain install "$floor" --profile minimal

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Check against the declared floor
        run: just lint-msrv-targets
