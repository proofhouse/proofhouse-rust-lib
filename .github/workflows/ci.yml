---
# Main quality gate. Runs the full lint set, the module-structure
# contracts, the Cargo.lock drift check, and the test suite (matrixed
# across linux/macOS/windows native runners) on every pull request and
# every push to `main`.
# Each gate runs as its own job so a flake in one block does not
# require rerunning the others and the PR status surfaces which gate
# fired.
# The text-quality lint set (vale, cspell, rumdl, biome, yamllint,
# tombi) rides in one job off the Brewfile toolchain.
#
# Every job installs `just` from a SHA-pinned casey/just release
# tarball, verifies the bundled SHA256SUMS, and then invokes the
# matching `just <recipe>` so the recipe is the single source of
# truth for what the gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Invokes only the `lint` aggregator recipe, so the job stays
  # unchanged as new gates land — each gate appends itself to the
  # aggregator in the Justfile instead. Those gates used to run only
  # through the local pre-commit hooks, which `git commit --no-verify`
  # walks straight past, so nothing on the merge path read them. The
  # set spans two toolchains now: the prose, spelling, Markdown, JSON,
  # YAML, and TOML checkers come out of the Brewfile, while the Rust
  # gates want a compiler, so the pinned toolchain gets installed here
  # too.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml, same as the other jobs. Its own
      # caching stays off so the step below can own that policy.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Restores on every run, writes back only from `main`, matching
      # the test job. rustfmt reads no build artifacts, but the gates
      # that arrive later compile the crate.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The ubuntu-24.04 image ships Homebrew but leaves its prefix off
      # the PATH, so expose the bin and sbin directories before any brew
      # invocation.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      # Brings in vale, cspell, rumdl, biome, yamllint, and tombi,
      # alongside the rustup and cargo helpers later recipes reach for.
      # The Brewfile also names just, which the setup step above already
      # installed; letting brew reinstall it costs less than keeping a
      # second, partial dependency list in step with the first. Its
      # rustup formula puts a second cargo under the Homebrew prefix,
      # and guarding against exactly that is why the Justfile exports a
      # PATH with the shim directory in front: the toolchain the step
      # above pinned wins no matter which of the two ran last.
      - name: Install Homebrew dependencies
        run: brew bundle install

      # No Homebrew formula packages cargo-machete, so this step fetches
      # a prebuilt binary rather than spending a compile on it. The
      # action checks the download against the publisher's checksum and
      # build attestation on its own. The version sits beside a marker
      # comment Renovate reads, since nothing in its stock managers knows
      # how to find a crate name inside a workflow input.
      - name: Install cargo tools
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          # renovate: datasource=crate depName=cargo-machete
          tool: cargo-machete@0.9.2

      # Vale's style packages are downloaded, not vendored, so
      # `lint-prose` fails on a bare checkout without this. The narrower
      # recipe rather than `install-tools`, whose other half installs a
      # floating cargo build of the tool the step above just pinned.
      - name: Sync Vale styles
        run: just vale-sync

      - name: Run lint gates
        run: just lint

  # The two module-structure checkers block a merge from here rather
  # than from the `lint` aggregator, which every other gate shares.
  # Neither one is cheap to have around: cargo-modules is published as
  # source only and pulls rust-analyzer's crate stack in behind it,
  # while cargo-pup reads the compiler's own data structures and so
  # loads only under the dated nightly it was compiled against.
  # Answering to a second toolchain and a source build of that size is
  # not something to ask of the job the ordinary checkers run in, so
  # these two take a job of their own and stay just as blocking.
  arch:
    name: arch
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action reads rust-toolchain.toml whatever else it is told,
      # so naming the nightly here adds it beside the pinned stable
      # instead of replacing it: cargo-modules builds and runs on the
      # pin, cargo-pup on the nightly. The three components are what a
      # compiler plugin links against. Caching belongs to the step
      # below, as in the other jobs.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-01-22
          components: rust-src,rustc-dev,llvm-tools-preview
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # Both binaries are compiled here because neither has a prebuilt
      # channel to fetch from. The cache above holds ~/.cargo/bin, so a
      # run that restores it finds both already there and cargo says as
      # much and stops; the compile is what a cache miss costs. Each
      # version is written out, and each moves the way the nightly date
      # above does: by hand, since no dependency manager reads a
      # `cargo install` line.
      - name: Install the module checkers
        run: |
          cargo install --locked cargo-modules --version 0.26.0
          cargo +nightly-2026-01-22 install cargo_pup --version 0.1.8 --locked

      - name: Check for unreached modules
        run: just lint-arch

      - name: Check the layer contract
        run: just lint-pup

  # Fails the merge when Cargo.lock no longer matches the manifests, so
  # every change to the dependency closure arrives as a reviewable lock
  # diff rather than resolving differently on each machine.
  lock-check:
    name: lock-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No toolchain input: the action reads rust-toolchain.toml and
      # installs the version pinned there, which is the same resolution
      # a contributor's rustup performs inside the repo.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Check lock drift
        run: just lock-check

  test:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure should not hide the others: a bug that
      # only shows up on Windows is worth seeing next to a green macOS
      # slot, not instead of it.
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    steps:
      # harden-runner's egress monitoring is built on Linux kernel
      # facilities, so the macOS and Windows slots skip it.
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Caching is turned off here and handed to the explicit step
      # below, because the action's built-in wiring saves a fresh cache
      # from every branch and this repo wants writes from `main` only.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Every slot restores the registry and target directories; only
      # pushes to `main` write a new entry back. Pull request runs would
      # otherwise each save a near-identical cache and evict the warm
      # one their own next run wants to read.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Run tests
        run: just test

      # Doctests need their own invocation: the recipe pair exists
      # because `cargo test` and `cargo test --doc` cover disjoint sets.
      - name: Run doctests
        run: just test-doc

  # Replays the concurrency layer under every thread interleaving loom
  # can reach, which is a different detector from the matrix above
  # rather than more of it: the suite reports what one ordering does
  # and this reports what the worst ordering does. A publication read
  # too weakly, or two threads computing one entry, shows up here and
  # nowhere else. One Linux slot on the pinned toolchain is enough,
  # since the search reads the memory model and not the platform, and
  # the models are small enough for the whole replay to take seconds.
  loom:
    name: loom
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml like every other job here: the models
      # are ordinary safe code and run on the shipping compiler.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      # Restores on every run and writes back from `main` alone, as
      # the jobs above do. The cache key carries the job name, and the
      # cfg the recipe sets changes every compilation fingerprint, so
      # what lands here is a build of its own rather than a second copy
      # of the matrix job's.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Run the interleaving models
        run: just test-loom
