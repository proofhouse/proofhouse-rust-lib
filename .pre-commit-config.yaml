---
default_stages: [pre-commit, pre-push]

# Hooks never touch generated or third-party trees: Vale's synced
# style packages arrive via `vale sync` and follow upstream style.
exclude: ^\.vale/(Google|write-good|proselint|ai-tells.*)/

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        entry: yamllint -c .yamllint.yaml --strict
        types: [yaml]

  - repo: https://github.com/vale-cli/vale
    rev: fe71481c95665a2343d81874489f8b012442a377  # frozen: v3.17.0
    hooks:
      # Scope the pre-commit-stage hook to the file types .vale.ini
      # actually configures rules for (Markdown + Rust source;
      # pre-commit's identify tags a .rs file as rust). The upstream
      # hook defaults to types: [text], which passes every text file
      # plus .git/COMMIT_EDITMSG; vale then parses the commit-message
      # buffer as plain text (no extension), backticks lose their
      # code-span meaning, and rules like Google.Spacing flag dotted
      # identifiers even inside backticks. The vale-commit-msg hook
      # from proofhouse/pre-commit-hooks (below) handles the commit
      # message with a strip-and-vale pipeline that drops git's helper
      # comments and the verbose-diff scissors block before invoking
      # vale. Extend types_or when .vale.ini grows a new section.
      - id: vale
        types_or: [markdown, rust]
        # Agent output template from the proofhouse package: one
        # machine-parseable line per finding.
        args: [--output=proofhouse-agent.tmpl]
        # CHANGELOG.md is generated by `cog changelog`, whose Title-Case
        # section headings ("Bug Fixes", "Continuous Integration") are a
        # cocogitto convention, not prose under this project's control.
        # The prose recipes (lint-prose, lint-markdown) already skip it
        # via --glob; .vale.ini cannot exempt it on its own because the
        # explicit per-rule toggles in [*.md] survive an empty
        # BasedOnStyles in the CHANGELOG.md block. Exclude it here too.
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 75cad3ecfe02b58e8165d3ac08d117bee207ed3d  # frozen: v0.2.43
    hooks:
      - id: rumdl-fmt
      - id: rumdl

  # Shared commit-msg gates. All four run on the commit-msg stage (see the
  # manifest); commitlint and commit-trailers need only bash/git, while
  # vale-commit-msg and cspell-commit-msg lean on this repo's vale/cspell
  # plus the commit-message scope in .vale.ini and .cspell.jsonc.
  # commitlint here is a bash port of the retired Go commitlint binary.
  # Pinned by SHA with a `# frozen:` tag comment so Renovate's pre-commit
  # manager tracks it, the same as the other hook repos above.
  - repo: https://github.com/proofhouse/pre-commit-hooks
    rev: 72e252992cbcdf4a503b7ce9145cdaf48bdc0cb9  # frozen: v0.3.0
    hooks:
      - id: commit-trailers
      - id: commitlint
      - id: vale-commit-msg
      - id: cspell-commit-msg

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      - id: tombi
        name: tombi (TOML lint + format-check)
        entry: just lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      # The fixer runs here, the way the biome hook above rewrites
      # rather than reports. On the merge path the check-only twin
      # `lint-rs-format` runs instead, so a commit that skipped its
      # hooks still meets a gate that fails on drift.
      - id: rustfmt
        name: rustfmt
        entry: just format-rs
        language: system
        types: [rust]
        pass_filenames: false

      # Tree-wide .editorconfig enforcement. No types or files filter:
      # the gate spans every tracked file, so a newly added config or
      # fixture with CRLF endings or a missing final newline has to trip
      # it. editorconfig-checker resolves its own file set from git, so
      # pass_filenames stays off; the top-level `exclude:` above is
      # mirrored in .editorconfig-checker.json's Exclude list.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: just lint-editorconfig
        language: system
        pass_filenames: false

      # The Justfile is the definition every other hook here delegates
      # to, so it gets a formatting gate of its own. files: pins the
      # hook to that one path — just --fmt reads the justfile it
      # resolves, not a passed file list, so pass_filenames is off and
      # the recipe would otherwise fire on every commit.
      - id: just-fmt
        name: just --fmt check
        entry: just lint-just
        language: system
        files: ^Justfile$
        pass_filenames: false

      # The lock file resolves the whole workspace, so the xtask
      # manifest has to trigger this as well as the root one; the
      # pattern matches any Cargo.toml, not just the anchored root
      # path. The recipe reads the graph under --locked and fails on
      # drift rather than re-resolving.
      - id: lock-check
        name: Cargo.lock drift check
        entry: just lock-check
        language: system
        files: (^|/)Cargo\.(toml|lock)$
        pass_filenames: false

      # Tree-wide spell check at pre-commit and pre-push. Scoped off
      # the commit-msg stage so the cspell-commit-msg hook from
      # proofhouse/pre-commit-hooks owns the commit buffer with
      # worktree-safe config resolution.
      - id: cspell
        name: cspell
        entry: cspell --config .cspell.jsonc --no-summary --no-progress --no-must-find-files
        language: system
        stages: [pre-commit, pre-push]
        types: [text]
