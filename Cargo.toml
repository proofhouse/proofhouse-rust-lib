[package]
name = "proofhouse-rust-lib"
description = "Reference library for the Proofhouse Rust lib reference repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[workspace]
members = ["xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

# Compiler lints raised to hard errors for every workspace member.
# dead_code reports items nothing reaches; unreachable_pub reports items
# marked `pub` that no path outside the crate can name, which is how an
# internal helper quietly widens the published surface. missing_docs
# holds the published surface to a doc comment apiece: a reference
# library is read as much as it is called, and an undocumented public
# item is a gap in what it teaches. The task runner inherits the rule
# without consequence, having no public item beyond the module comment
# it already carries.
[workspace.lints.rust]
dead_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

# Every clippy group at once, restriction included, each sitting at
# priority -1 so the individual entries further down win. The sibling
# repositories select their whole rule catalog and then justify each
# exception; this is that bargain in clippy's vocabulary. Warnings become
# errors in the recipe rather than here, so a local `cargo clippy` still
# prints the full list instead of stopping at the first one.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
# Redundant with restriction, which already carries this lint, but the
# explicit entry keeps the threshold in clippy.toml discoverable from the
# manifest that turns the check on.
cognitive_complexity = "warn"
# Suppressions have to be `#[expect(..., reason = "...")]`: expect
# expires with a compile error once the finding stops firing, and the
# reason spares the next reader a git blame.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Objects to selecting the restriction group wholesale, which is the
# decision above.
blanket_clippy_restriction_lints = "allow"
# Pulls in the opposite direction from `needless_return` in the style
# group; the tail expression stays.
implicit_return = "allow"
# Objects to the `?` operator, which is how every fallible function here
# hands an error back to its caller. Spelling each one out as a match on
# the result would bury the work the function exists to do.
question_mark_used = "allow"
# Would force an empty trailing block wherever the remaining case is a
# deliberate no-op, which `needless_else` then reports.
else_if_without_else = "allow"
# Wants every default trait method rewritten by hand, including the
# deprecated `Error` accessors no caller should reach for.
missing_trait_methods = "allow"
# Inlining is a decision to make against a measurement, not a default to
# stamp on every public item.
missing_inline_in_public_items = "allow"
# Alphabetical item order would scatter the operator variants away from
# the order an expression grammar reads in.
arbitrary_source_item_ordering = "allow"
# Default binding modes are the idiom the rest of the language is
# written in; spelling out `&` in every pattern buys nothing here.
pattern_type_mismatch = "allow"
# The enums and structs here are contracts callers match exhaustively.
# Marking them `#[non_exhaustive]` would take that away.
exhaustive_enums = "allow"
exhaustive_structs = "allow"
# Unit tests live in the file they cover so they can reach private
# items, which means an inline `mod tests` in nearly every source file.
inline_modules = "allow"
# Both lints serve crates that build without the standard library. This
# one links std by design.
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
# Penalizes splitting a readable helper out of its one caller.
single_call_fn = "allow"

# Rustdoc's own diagnostics, raised past the warning level most of them
# ship at. Each one marks documentation that still renders and still
# misleads — a link whose target no longer exists, an example the
# doctest harness never compiles because rustdoc could not parse it, an
# open HTML tag that swallows the text behind it, a backtick with no
# partner. The rendered page looks finished in every one of those cases,
# which is why the compiler has to be the one to notice.
#
# Two entries stay out. private_doc_tests would reject an example on a
# private item, and an internal helper is often exactly where an example
# is worth writing. missing_doc_code_examples has yet to leave nightly
# and a release toolchain refuses to load it.
[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"
